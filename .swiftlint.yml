included:
  - PauseGuard
  - PauseGuardTests
  - PauseGuardUITests

excluded:
  - .build
  - build
  - DerivedData
  - SourcePackages
  - Pods
  - Carthage

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - sorted_first_last
  - toggle_bool
  - vertical_parameter_alignment_on_call

analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  - todo
  - trailing_closure

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - i
    - x
    - y

reporter: xcode
